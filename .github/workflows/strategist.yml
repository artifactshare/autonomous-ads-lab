name: Strategist Agent
on:
  schedule:
    - cron: '43 23 * * 0' # Monday 08:43 JST, after weekly learning (08:13), before harness (09:17)
  workflow_dispatch:

concurrency:
  group: ads-lab-ops
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  strategist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:init
      - name: Run strategist agent (Claude Code headless, fable)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install -g @anthropic-ai/claude-code
          # One fable call per week; counts against the same weekly limit as the
          # hypothesis role in src/llm/policy.ts (docs/model-policy.md).
          claude -p "$(cat prompts/strategist.md)" \
            --model claude-fable-5 \
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep" \
            --permission-mode acceptEdits \
            --max-turns 60
      - name: Commit strategy + journal updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "ads-lab-bot"
          git config user.email "actions@github.com"
          git stash -u --quiet || true
          git checkout main
          git stash pop --quiet || true
          git add docs/strategy.md journal/ || true
          if git diff --cached --quiet; then exit 0; fi
          BRANCH="auto/strategist-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git commit -m "strategist: premises, issues, ideas"
          git push origin "$BRANCH"
          gh pr create --fill --head "$BRANCH"
          gh pr merge --auto --squash "$BRANCH"
          sleep 30
          for id in $(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?status=action_required&per_page=20" \
              -q '.workflow_runs[] | select(.actor.login as $a | ["github-actions[bot]", "ads-lab-bot", "coji"] | index($a)) | .id'); do
            gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/approve" && echo "approved run ${id}" || true
          done
