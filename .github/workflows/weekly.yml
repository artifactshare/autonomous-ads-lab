name: Weekly Learning
on:
  schedule:
    - cron: '0 23 * * 0' # Monday 08:00 JST
  workflow_dispatch:

concurrency:
  group: ads-lab-ops
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Placeholder until Phase 5-6: learning extraction + living report update.
      - run: pnpm tsx src/ops/weekly.ts
        env:
          ARTIFACTSHARE_TOKEN: ${{ secrets.ARTIFACTSHARE_TOKEN }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      - name: Commit Experience DB changes
        run: |
          git config user.name "ads-lab-bot"
          git config user.email "actions@github.com"
          git add data/ journal/
          git diff --cached --quiet || git commit -m "weekly: learning update [skip ci]"
          git push
