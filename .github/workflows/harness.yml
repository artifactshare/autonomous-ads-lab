name: Harness Agent
on:
  schedule:
    - cron: '17 0 * * 1' # Monday 09:00 JST, after weekly learning
  workflow_dispatch:

concurrency:
  group: ads-lab-ops
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run harness agent (Claude Code headless)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install -g @anthropic-ai/claude-code
          claude -p "$(cat prompts/harness-agent.md)" \
            --model claude-opus-5 \
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep" \
            --permission-mode acceptEdits \
            --max-turns 80
      - name: Commit journal updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "ads-lab-bot"
          git config user.email "actions@github.com"
          git stash -u --quiet || true
          git checkout main
          git stash pop --quiet || true
          git add journal/ || true
          if git diff --cached --quiet; then exit 0; fi
          BRANCH="auto/harness-journal-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git commit -m "harness-agent: journal"
          git push origin "$BRANCH"
          gh pr create --fill --head "$BRANCH"
          gh pr merge --auto --squash "$BRANCH"
