name: Daily Ops
on:
  schedule:
    - cron: '0 22 * * *' # 07:00 JST daily (best effort; GH cron can lag)
  workflow_dispatch:

concurrency:
  group: ads-lab-ops # shared with weekly.yml: never run two ops jobs at once
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Placeholder until Phase 5: real daily loop (metrics -> decide -> act).
      - run: pnpm tsx src/ops/daily.ts
        env:
          ARTIFACTSHARE_TOKEN: ${{ secrets.ARTIFACTSHARE_TOKEN }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      - name: Commit Experience DB changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "ads-lab-bot"
          git config user.email "actions@github.com"
          git add data/ journal/
          if git diff --cached --quiet; then exit 0; fi
          BRANCH="auto/${GITHUB_WORKFLOW// /-}-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git commit -m "${GITHUB_WORKFLOW}: experience db + journal update"
          git push origin "$BRANCH"
          gh pr create --fill --head "$BRANCH"
          gh pr merge --auto --squash "$BRANCH"
