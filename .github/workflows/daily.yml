name: Daily Ops
on:
  schedule:
    - cron: '0 22 * * *' # 07:00 JST daily (best effort; GH cron can lag)
  workflow_dispatch:

concurrency:
  group: ads-lab-ops # shared with weekly.yml: never run two ops jobs at once
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write # approve stuck CI runs; dispatch harness on failure

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsx src/ops/daily.ts
        env:
          ARTIFACTSHARE_TOKEN: ${{ secrets.ARTIFACTSHARE_TOKEN }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit Experience DB changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "ads-lab-bot"
          git config user.email "actions@github.com"
          git add data/ journal/
          if git diff --cached --quiet; then exit 0; fi
          BRANCH="auto/${GITHUB_WORKFLOW// /-}-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git commit -m "${GITHUB_WORKFLOW}: experience db + journal update"
          git push origin "$BRANCH"
          gh pr create --fill --head "$BRANCH"
          gh pr merge --auto --squash "$BRANCH"
      # Bot-authored PRs sometimes land in action_required (GitHub treats the
      # bot as a first-time contributor). Un-stick them so auto-merge proceeds.
      # Fork PRs never receive secrets, so approving them runs no trusted code.
      - name: Approve stuck workflow runs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Trusted actors only: never auto-approve a stranger's fork PR run.
          for id in $(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?status=action_required&per_page=20" \
              -q '.workflow_runs[] | select(.actor.login as $a | ["github-actions[bot]", "ads-lab-bot", "coji"] | index($a)) | .id'); do
            gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/approve" && echo "approved run ${id}" || true
          done
      # Self-healing: any failure wakes the harness agent immediately instead
      # of waiting for Monday.
      - name: Dispatch harness agent on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run harness.yml -R "${GITHUB_REPOSITORY}"
