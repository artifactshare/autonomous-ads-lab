name: Needs Human Notification
on:
  issues:
    types: [labeled]

permissions:
  issues: read

jobs:
  notify:
    if: github.event.label.name == 'needs-human'
    runs-on: ubuntu-latest
    steps:
      - name: Post to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TITLE: ${{ github.event.issue.title }}
          URL: ${{ github.event.issue.html_url }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then echo "SLACK_WEBHOOK_URL not set; skipping"; exit 0; fi
          payload=$(jq -n --arg t "$TITLE" --arg u "$URL" --arg n "$NUMBER" \
            '{text: ("🙋 ads-lab needs a human: #" + $n + " " + $t + "\n" + $u)}')
          curl -sf -X POST -H 'Content-Type: application/json' -d "$payload" "$SLACK_WEBHOOK_URL"
