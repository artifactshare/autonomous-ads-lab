name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  budget-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Hard budget limits are the project's single human gate. The expected
      # values live HERE because GITHUB_TOKEN cannot modify workflow files,
      # so neither the harness agent nor an external PR author can silently
      # change both sides. Changing limits requires a human editing this file.
      - name: Verify budget limits are untouched
        run: |
          node -e "
          const src = require('fs').readFileSync('src/config.ts', 'utf8');
          const expect = {
            monthlyCreativeUsd: 10,
            monthlyAdsUsd: 30,
            monthlyAiUsd: 10,
            dailyAdsCapUsd: 1,
          };
          for (const [k, v] of Object.entries(expect)) {
            const m = src.match(new RegExp(k + String.raw\`:\s*([0-9.]+)\`));
            if (!m || Number(m[1]) !== v) {
              console.error('BUDGET GUARD FAILED: ' + k + ' expected ' + v + ' got ' + (m ? m[1] : 'missing'));
              process.exit(1);
            }
          }
          // A full month of capped days must fit the monthly cap, or the
          // monthly guard ends up doing the daily cap's job mid-month
          // (September 2026: \$1.5/day x 30 = \$45 against \$30).
          if (expect.dailyAdsCapUsd * 30 > expect.monthlyAdsUsd) {
            console.error('BUDGET GUARD FAILED: dailyAdsCapUsd x 30 exceeds monthlyAdsUsd');
            process.exit(1);
          }
          console.log('budget limits verified');
          "
